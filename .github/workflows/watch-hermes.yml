name: Veille versions Hermes

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: hermes-release-watch
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'ProGregoryBrunel/runtipi-custom-appstore'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lire le catalogue existant
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2 (Node.js 24)
        with:
          persist-credentials: false
      - name: Tests unitaires hors réseau
        run: python3 -m unittest discover -s tests -p 'test_watch_hermes_updates.py' -v
      - name: Vérifier les releases stables et notifier via GitHub Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/watch_hermes_updates.py --publish-issue
