name: Veille versions Hermes

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: hermes-release-watch
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'ProGregoryBrunel/runtipi-custom-appstore'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lire le catalogue existant
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Vérifier les releases stables et notifier via GitHub Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/watch_hermes_updates.py --publish-issue
