name: Tests PR Hermes

on:
  pull_request:
    paths:
      - 'scripts/prepare_hermes_update.py'
      - 'scripts/watch_hermes_updates.py'
      - 'tests/test_*hermes*.py'
      - '.github/workflows/test-hermes-pr.yml'
      - '.github/workflows/auto-hermes-catalog.yml'
      - 'scripts/auto_hermes_catalog.py'
      - 'scripts/hermes_pair_runtime_probe.py'
      - 'scripts/smoke_hermes_pair.sh'
      - 'apps/hermes-suite/docker-compose.yml'
      - 'apps/hermes-suite/config.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hermes:
    name: Tests unitaires Hermes (sans réseau applicatif)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Vérifier la syntaxe Python
        run: python3 -m compileall -q scripts/prepare_hermes_update.py scripts/watch_hermes_updates.py scripts/auto_hermes_catalog.py scripts/hermes_pair_runtime_probe.py tests/
      - name: Tester la préparation et la veille des versions
        run: python3 -m unittest discover -s tests -p 'test_*hermes*.py' -v

  baseline-integration:
    name: Agent/WebUI Docker smoke (pinned baseline)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      AGENT_VERSION: v0.23.1
      WEBUI_VERSION: 0.52.677
      HERMES_SMOKE_BASELINE: '1'
    steps:
      - name: Récupérer le catalogue sans identifiants
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Tester les vraies images épinglées et la suppression de session
        run: bash scripts/smoke_hermes_pair.sh
